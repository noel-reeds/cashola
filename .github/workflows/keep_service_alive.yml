name: keep-service-alive

on:
  schedule:
    - cron: '15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-bash@v2
        with:
          bash-version: 5.x
      - name: run bash script
        run: bash keep-service-alive.sh
